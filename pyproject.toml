[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creativesignal"
version = "0.1.0"
description = "Evidence-backed creative-intelligence copilot for skincare ads"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.0",
    "anthropic==0.49.0",
    "chromadb==0.6.3",
    "sentence-transformers==3.4.0",
    "rank-bm25==0.2.2",
    "scikit-learn==1.6.0",
    "pandas==2.2.0",
    "streamlit==1.41.0",
    "arize-phoenix==8.0.0",
    "ragas==0.2.0",
    "datasets==3.2.0",
    "matplotlib==3.10.0",
    "mcp==1.6.0",
    "pytest==8.3.0",
    "openpyxl==3.1.5",
    "python-dotenv==1.0.1",
    # Transitive pins. arize-phoenix 8.0.0 imports `phoenix.evals.models`
    # (dropped in arize-phoenix-evals 2.x+) and `uvicorn.config.LoopSetupType`
    # (dropped in uvicorn 0.35+). Unpinned, both break `import phoenix` — and
    # because Phoenix registers a pytest11 plugin, that took down the entire
    # test suite at collection time, not just tracing.
    "arize-phoenix-evals==0.20.8",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/creativesignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Third-party deprecation noise (Phoenix's Starlette/Authlib usage) drowns out
# real output. Our own code's warnings still surface.
filterwarnings = [
    "ignore::DeprecationWarning:phoenix.*",
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
    "ignore:.*authlib.jose.*:DeprecationWarning",
]
